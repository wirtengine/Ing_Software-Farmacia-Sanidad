# ===============================
# Spring Boot
# ===============================
spring.application.name=farmacia-sanidad-backend

# ===============================
# Server
# ===============================
server.port=8080
server.servlet.context-path=/api

# ===============================
# Database (Supabase PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://db.oqhowdjidqswyeygpksx.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=4SbO450crc5MFGhP
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HikariCP — CRÍTICO para Supabase
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=false

# ===============================
# Multipart (subida de imágenes)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:miClaveSuperSeguraDe32Caracteres123456}
jwt.expiration=${JWT_EXPIRATION:3600000}

